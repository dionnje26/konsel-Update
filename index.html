<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Konsel Update – Berita Terkini Konawe Selatan</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f7;--surface:#fff;--ink:#0d2a38;--muted:#566c78;--line:#d3dfe3;--sea:#0e7b88;--sea-d:#095963;--g:#10de4b;--gd:#122c19;--sun:#f3b73e;--sun-ink:#2b1f00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1a22;--surface:#10242e;--ink:#e6f0f3;--muted:#9bb2bc;--line:#22404d;--sea:#4cc3d1;--sea-d:#7fd8e3}}
:root[data-theme="dark"]{--bg:#0a1a22;--surface:#10242e;--ink:#e6f0f3;--muted:#9bb2bc;--line:#22404d;--sea:#4cc3d1;--sea-d:#7fd8e3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 "Newsreader",Georgia,serif}
h1,h2,h3,h4,.ui{font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.meta{font:500 13px "Bricolage Grotesque",sans-serif;color:var(--muted)}
.tag{font:700 12px "Bricolage Grotesque",sans-serif;color:var(--sea-d);text-transform:uppercase;letter-spacing:.03em}
.topstrip{background:#0b1d11;color:#b9d8c2;font:500 13px "Bricolage Grotesque",sans-serif}
.topstrip .wrap{display:flex;gap:14px;align-items:center;height:36px}.topstrip .sp{flex:1}.topstrip a{color:#e3f4e8}
.topstrip button{font:600 12px "Bricolage Grotesque",sans-serif;background:transparent;color:#e3f4e8;border:1px solid #2c5a3a;border-radius:999px;padding:3px 11px;cursor:pointer}
header.top{background:var(--gd);border-bottom:3px solid var(--g)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0 8px}
.logo img{display:block;height:58px;width:auto;max-width:100%}
.tools input{font:16px "Newsreader",serif;padding:9px 16px;border:1px solid #2c5a3a;border-radius:999px;background:var(--surface);color:var(--ink);width:240px;max-width:100%}
nav.cats{display:flex;gap:6px;overflow-x:auto;padding:6px 0 12px;scrollbar-width:none}
nav.cats a{flex:none;font:600 14px "Bricolage Grotesque",sans-serif;color:#e3f4e8;border:1px solid #2c5a3a;border-radius:999px;padding:6px 14px}
nav.cats a:hover{border-color:var(--g)}
nav.cats a[aria-current]{background:var(--g);border-color:var(--g);color:#08240f}
header.top :focus-visible{outline-color:var(--g)}
.ticker{background:var(--sun);color:var(--sun-ink);font:600 14px/1 "Bricolage Grotesque",sans-serif;overflow:hidden;white-space:nowrap}
.ticker .wrap{display:flex;gap:14px;align-items:center;height:38px}
.ticker b{background:var(--sun-ink);color:var(--sun);padding:5px 10px;border-radius:4px;flex:none}
.ticker span{display:inline-block;padding-left:100%;animation:run 40s linear infinite}
@keyframes run{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.ticker span{animation:none;padding-left:0}}
.hero2{display:grid;grid-template-columns:2fr 1fr;gap:16px;padding:20px 0 4px}
.lead2{position:relative;min-height:380px;border-radius:12px;overflow:hidden;display:flex;align-items:flex-end;color:#fff}
.grad{position:absolute;inset:0;background:linear-gradient(transparent 25%,rgba(0,0,0,.78))}
.lt{position:relative;padding:22px}
.lead2 h1{font-size:clamp(24px,3.4vw,36px);line-height:1.12;margin:10px 0;letter-spacing:-.02em;font-weight:800}
.tag2{background:var(--g);color:#08240f;font:700 12px "Bricolage Grotesque",sans-serif;padding:4px 9px;border-radius:4px;text-transform:uppercase}
.meta2{font:500 13px "Bricolage Grotesque",sans-serif;opacity:.9}
.side2{display:grid;gap:10px;align-content:start}
.si{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;align-items:center}
.th{display:block;aspect-ratio:4/3;border-radius:8px}
.st{display:block;font:600 15px/1.25 "Bricolage Grotesque",sans-serif;margin-top:3px}
.si:hover .st,.card h3 a:hover,.pop a:hover,.rel a:hover{color:var(--sea)}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:30px 0 12px}
.sec h2{font-size:24px;margin:0;letter-spacing:-.02em;border-left:5px solid var(--g);padding-left:10px}
.sec a{font:600 14px "Bricolage Grotesque",sans-serif;color:var(--sea-d)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 18px}
.card .im{position:relative;display:grid;place-items:center;aspect-ratio:16/10;border-radius:10px;color:#fff;font:700 15px "Bricolage Grotesque",sans-serif}
.cm{display:flex;gap:10px;align-items:baseline;margin:9px 0 3px}
.card h3{margin:0;font:700 18px/1.25 "Bricolage Grotesque",sans-serif}
.pl{position:absolute;inset:0;margin:auto;width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.6)}
.pl::after{content:"";position:absolute;left:18px;top:14px;border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent}
.two{display:grid;grid-template-columns:2fr 1fr;gap:28px}
.two .grid{grid-template-columns:repeat(2,1fr)}
.pop{list-style:none;margin:0 0 20px;padding:0;counter-reset:p}
.pop li{counter-increment:p;display:grid;grid-template-columns:32px 1fr;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.pop li::before{content:counter(p);font:800 22px/1 "Bricolage Grotesque",sans-serif;color:var(--sea)}
.pop a{font:600 16px/1.3 "Bricolage Grotesque",sans-serif}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin:20px 0}
.box h2{margin:0 0 6px;font-size:18px}.box p{margin:0;font-size:16px}.box a{color:var(--sea-d);font-weight:600}
.adbox{display:block;text-align:center;border:2px dashed var(--line);border-radius:12px;padding:34px 12px;color:var(--muted);font:600 15px "Bricolage Grotesque",sans-serif}
.empty{padding:50px 0;color:var(--muted)}
footer{background:var(--gd);color:#c9e3d0;margin-top:46px;padding:36px 0 18px;font-size:16px}
.fg{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:26px}
.fg h4{margin:0 0 10px;color:#fff}.fg ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.fg a:hover{color:var(--g)}.flogo{height:52px;width:auto;display:block;margin-bottom:10px}
.cp{border-top:1px solid #2c5a3a;margin-top:24px;padding-top:14px;font-size:14px}
.art{max-width:700px;margin:0 auto;padding:26px 0 20px}
.art h1{font-size:clamp(28px,5vw,42px);line-height:1.1;letter-spacing:-.025em;margin:8px 0 10px;font-weight:800}
.art .cover{aspect-ratio:16/8;border-radius:10px;margin:18px 0}
.art .lede{font-size:21px;line-height:1.5;font-weight:500}.art p{margin:0 0 18px}
.back{font:600 14px "Bricolage Grotesque",sans-serif;color:var(--muted);display:inline-block;margin-bottom:16px}
.cbtn{font:600 14px "Bricolage Grotesque",sans-serif;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 16px;cursor:pointer}
a.cbtn{display:inline-block}
.wa-s{background:var(--g);border-color:var(--g);color:#08240f}
.shr{display:flex;gap:10px;flex-wrap:wrap}
.vd{display:block;width:100%;max-height:72vh;background:#000;border-radius:10px;margin:0 0 18px;object-fit:contain}
.rel{border-top:1px solid var(--line);margin-top:34px}.rel h2{font-size:20px;margin:18px 0 4px}
.rel a{display:block;padding:12px 0;border-bottom:1px solid var(--line);font:600 17px/1.3 "Bricolage Grotesque",sans-serif}
.rel .cbtn{margin:8px 0}
.f{display:grid;gap:14px;margin:18px 0}
.f label{display:grid;gap:5px;font:600 14px "Bricolage Grotesque",sans-serif}
.f input,.f textarea,.f select{font:17px "Newsreader",serif;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%}
.f input[type=checkbox]{width:auto}
.chk{display:flex;gap:18px;flex-wrap:wrap}.f .chk label{display:flex;align-items:center;gap:6px;font-weight:500}
.pub{background:var(--sea);border-color:var(--sea);color:#fff}
.bn{display:none}
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(90px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:18px 0 8px}.sheet .lk{display:flex;flex-wrap:wrap;gap:8px}
.sheet .lk a{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font:600 14px "Bricolage Grotesque",sans-serif}
@media(max-width:900px){.hero2,.two{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.fg{grid-template-columns:1fr 1fr}.lead2{min-height:300px}}
@media(max-width:600px){body{font-size:17px;padding-bottom:64px}.grid,.two .grid{grid-template-columns:1fr}.tools input{width:150px}.logo img{height:46px}.fg{grid-template-columns:1fr}
.bn{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
.bn a,.bn button{font:600 12px "Bricolage Grotesque",sans-serif;background:none;border:0;color:var(--muted);padding:8px 0;cursor:pointer;text-align:center}
.bn [aria-current]{color:var(--sea-d)}}
</style>
</head>

 '<div class="rel"><h2>Berita Anda ('+SAVED.length+')</h2>'+(SAVED.length?SAVED.map(function(n,i){return '<a href="#berita.'+L(n)+'">'+esc(n.t)+'</a><button class="cbtn" type="button" data-edit="'+i+'">Edit</button> <button class="cbtn" type="button" data-del="'+i+'">Hapus</button>'}).join(""):'<p class="meta">Belum ada.</p>')+'</div>';
 function clear(){ed=null;["f-t","f-s","f-b","f-r","f-v","f-k"].forEach(function(i){$(i).value=""});$("f-w").value="Redaksi";$("f-i").value="";$("f-vf").value="";$("f-brk").checked=$("f-pick").checked=$("f-tr").checked=false;$("f-go").textContent="Terbitkan";$("f-cancel").hidden=true;$("f-h").textContent="Tulis berita";$("f-msg").textContent=""}
 function fill(n){ed=n;$("f-t").value=n.t;$("f-c").value=n.c;$("f-s").value=n.s;$("f-b").value=n.b||"";$("f-w").value=n.w||"Redaksi";$("f-r").value=n.src||"";$("f-v").value=n.vid||"";$("f-k").value=n.kec||"";$("f-brk").checked=!!n.brk;$("f-pick").checked=!!n.pick;$("f-tr").checked=!!n.trend;$("f-i").value="";$("f-vf").value="";$("f-go").textContent="Simpan perubahan";$("f-cancel").hidden=false;$("f-h").textContent="Edit berita";$("f-msg").textContent=n.img?" Foto lama dipakai kecuali Anda memilih foto baru.":"";window.scrollTo(0,0)}
 $("f-out").onclick=function(){fetch("/api/logout",{method:"POST",credentials:"same-origin"}).then(function(){location.hash="#beranda";location.reload()})};
 $("f-cancel").onclick=clear;
 $("f-go").onclick=function(){
  var t=$("f-t").value.trim(),sm=$("f-s").value.trim();
  if(!t||!sm){$("f-msg").textContent=" Judul dan ringkasan wajib diisi.";return}
  var it=ed||{id:"n"+Date.now(),ts:Date.now(),p:1,img:""},prev=Object.assign({},it),fl=$("f-i").files[0],vf=$("f-vf").files[0];
  Object.assign(it,{c:$("f-c").value,t:t,s:sm,b:$("f-b").value.trim(),w:$("f-w").value.trim()||"Redaksi",src:$("f-r").value.trim(),vid:$("f-v").value.trim(),kec:$("f-k").value,brk:$("f-brk").checked,pick:$("f-pick").checked,trend:$("f-tr").checked});
  $("f-go").disabled=true;$("f-msg").textContent=" Menerbitkan...";
  Promise.all([fl?upload(fl):"",vf?upload(vf):""]).then(function(u){if(u[0])it.img=u[0];if(u[1])it.vid=u[1];if(!ed)SAVED.unshift(it);return persist()}).then(function(){location.hash="#beranda";location.reload()}).catch(function(){if(ed)Object.assign(it,prev);else{var k=SAVED.indexOf(it);if(k>-1)SAVED.splice(k,1)}$("f-go").disabled=false;$("f-msg").textContent=" Gagal menerbitkan. Pastikan Anda masih masuk dan file tidak terlalu besar."});
 };
 $("detail").onclick=function(e){var d=e.target.dataset||{};
  if(d.edit!==undefined){fill(SAVED[+d.edit]);return}
  if(d.del===undefined)return;
  var rm=SAVED.splice(+d.del,1);persist().then(function(){location.reload()}).catch(function(){SAVED.splice(+d.del,0,rm[0]);alert("Gagal menghapus berita.")})};
}


function bg(n){return "background:"+(n.img?'url("'+n.img+'") center/cover':COL[n.c])}
function tg(n,k){return k&&n.kec?'<a class="tag" href="#kecamatan.'+n.kec+'">'+n.kec+'</a>':'<a class="tag" href="#kategori.'+n.c+'">'+n.c+'</a>'}
function card(n,k){var h="#berita."+L(n);return '<article class="card"><a class="im" href="'+h+'" style=\''+bg(n)+'\'>'+(n.img?"":"<span>"+n.c+"</span>")+(n.vid?'<i class="pl"></i>':"")+'</a><div class="cm">'+tg(n,k)+'<span class="meta">'+(n.ts?ago(n.ts):(n.d||""))+'</span></div><h3><a href="'+h+'">'+esc(n.t)+'</a></h3></article>'}
function sec(t,h){return '<div class="sec"><h2>'+t+'</h2>'+(h?'<a href="'+h+'">Lihat Semua</a>':'')+'</div>'}
function grid(a,k){return '<div class="grid">'+a.map(function(n){return card(n,k)}).join("")+'</div>'}
function SOC(){return [["fb","Facebook"],["ig","Instagram"],["yt","YouTube"],["tt","TikTok"],["wa","WhatsApp"]].filter(function(x){return SITE[x[0]]}).map(function(x){return '<a href="'+esc(SITE[x[0]])+'" target="_blank" rel="noopener">'+x[1]+'</a>'}).join(" · ")}
function follow(){return '<div class="box"><h2>Ikuti Kami</h2><p>'+(SOC()||"Tautan media sosial belum diisi.")+'</p></div><a class="adbox" href="#halaman.info-iklan">Ruang iklan<br><small>Pasang iklan Anda di sini</small></a>'}
function home(){
 if(!NEWS.length)return '<p class="empty">Belum ada berita. Redaksi sedang menyiapkan kabar terbaru.</p>';
 var f=function(k){return NEWS.filter(function(n){return n[k]})},l=NEWS[0],sd=NEWS.slice(1,5),vd=f("vid").slice(0,3),tr=f("trend").slice(0,6),pk=f("pick").slice(0,2),rc=NEWS.slice(9,15),kc=f("kec").slice(0,6);
 var h='<section class="hero2"><a class="lead2" href="#berita.'+L(l)+'" style=\''+bg(l)+'\'><span class="grad"></span><div class="lt"><span class="tag2">'+l.c+'</span><h1>'+esc(l.t)+'</h1><span class="meta2">'+meta(l)+'</span></div></a><div class="side2">'+sd.map(function(n){return '<a class="si" href="#berita.'+L(n)+'"><span class="th" style=\''+bg(n)+'\'></span><span><b class="tag">'+n.c+'</b><span class="st">'+esc(n.t)+'</span></span></a>'}).join("")+'</div></section>';
 h+=sec("Kabar Terkini","#terkini")+grid(NEWS.slice(0,9));
 if(vd.length)h+=sec("Video","#video")+grid(vd);
 h+='<div class="two"><div>'+(pk.length?sec("Konten Pilihan")+grid(pk):"")+(rc.length?sec("Rekomendasi Untuk Anda")+grid(rc):"")+'</div><aside>'+(tr.length?sec("Trending","#trending")+'<ol class="pop">'+tr.map(function(n){return '<li><a href="#berita.'+L(n)+'">'+esc(n.t)+'</a></li>'}).join("")+'</ol>':"")+follow()+'</aside></div>';
 if(kc.length)h+=sec("Berita Kecamatan")+grid(kc,1);
 return h;
}
function listV(t,a){return '<div class="sec"><h2>'+esc(t)+'</h2><span class="meta">'+a.length+' berita</span></div>'+(a.length?grid(a):'<p class="empty">Belum ada berita di sini.</p>')}
function article(n){
 var o=NEWS.filter(function(x){return x!==n}),rel=o.filter(function(x){return x.c===n.c}).concat(o.filter(function(x){return x.c!==n.c})).slice(0,3);
 $("detail").innerHTML='<a class="back" href="#beranda">Kembali ke beranda</a>'+tg(n)+(n.kec?' '+tg(n,1):'')+'<h1>'+esc(n.t)+'</h1><div class="meta">'+meta(n)+'</div><div class="cover" style=\''+bg(n)+'\' role="img" aria-label="Foto berita"></div><p class="lede">'+esc(n.s)+'</p>'+(/^\/uploads\//.test(n.vid||"")?'<video class="vd" controls playsinline preload="metadata" src="'+esc(n.vid)+'"></video>':"")+
 (n.b?n.b.split(/\n+/).map(function(t){return '<p>'+esc(t)+'</p>'}).join(""):"")+
 (/^https?:\/\//.test(n.vid||"")?'<p><a class="cbtn" target="_blank" rel="noopener" href="'+esc(n.vid)+'">Tonton video</a></p>':"")+
 (n.src?'<p class="meta">Sumber: '+esc(n.src)+'</p>':'')+
 '<div class="shr"><a class="cbtn wa-s" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(n.t+" "+shareUrl(n))+'">Bagikan ke WhatsApp</a> <button class="cbtn" type="button" id="copy">Salin tautan</button></div>'+
 (rel.length?'<div class="rel"><h2>Berita terkait</h2>'+rel.map(function(x){return '<a href="#berita.'+L(x)+'">'+esc(x.t)+'</a>'}).join("")+'</div>':"");
 $("copy").onclick=function(){var b=this;try{navigator.clipboard.writeText(shareUrl(n)).then(function(){b.textContent="Tautan disalin"})}catch(e){b.textContent="Salin dari bilah alamat"}};
}
function show(v){$("home").hidden=v!=="home";$("list").hidden=v!=="list";$("detail").hidden=v!=="art"}
function route(){
 var m=(location.hash||"#").slice(1),dot=m.indexOf("."),r=dot<0?m:m.slice(0,dot),a=dot<0?"":decodeURIComponent(m.slice(dot+1)),act="",lt=null,T="Konsel Update \u2013 Berita Terkini Konawe Selatan";
 window.scrollTo(0,0);$("sheet").hidden=true;
 var by=function(k,v){return NEWS.filter(function(n){return v===undefined?n[k]:n[k]===v})};
 if(r==="redaksi"){admin();show("art");return}
 if(r==="berita"){var n=NEWS.filter(function(x){return L(x)===a})[0];if(n){article(n);document.title=n.t+" \u2013 Konsel Update";show("art");return}}
 if(r==="halaman"&&PAGES[a]){$("detail").innerHTML='<a class="back" href="#beranda">Kembali ke beranda</a><h1>'+PAGES[a][0]+'</h1><p>'+PAGES[a][1]+'</p>';document.title=PAGES[a][0]+" \u2013 Konsel Update";show("art");return}
 if(r==="terkini")lt=["Kabar Terkini",NEWS];
 else if(r==="trending")lt=["Trending",by("trend")];
 else if(r==="video")lt=["Video",by("vid")];
 else if(r==="kategori"&&COL[a]){lt=[a,by("c",a)];act=a}
 else if(r==="kecamatan")lt=["Kecamatan "+a,by("kec",a)];
 else if(r==="cari")lt=["Hasil pencarian: "+kw,NEWS.filter(function(n){return (n.t+" "+n.s+" "+(n.b||"")).toLowerCase().indexOf(kw)>-1})];
 if(lt){$("list").innerHTML=listV(lt[0],lt[1]);show("list");document.title=lt[0]+" \u2013 Konsel Update"}
 else{$("home").innerHTML=home();show("home");document.title=T;r="beranda"}
 [].forEach.call($("cats").children,function(x){if(x.dataset.c===act)x.setAttribute("aria-current","page");else x.removeAttribute("aria-current")});
 [].forEach.call($("bn").querySelectorAll("a"),function(x){if(x.dataset.r===r)x.setAttribute("aria-current","page");else x.removeAttribute("aria-current")});
}

$("sheet").innerHTML='<button class="cbtn" type="button" id="sh-x">Tutup</button><h3>Kategori</h3><div class="lk">'+CATS.map(function(c){return '<a href="#kategori.'+c+'">'+c+'</a>'}).join("")+'</div><h3>Kecamatan</h3><div class="lk">'+KEC.map(function(k){return '<a href="#kecamatan.'+k+'">'+k+'</a>'}).join("")+'</div><h3>Halaman</h3><div class="lk">'+Object.keys(PAGES).map(function(k){return '<a href="#halaman.'+k+'">'+PAGES[k][0]+'</a>'}).join("")+'</div>';
